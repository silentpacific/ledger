<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SentientLogs mega menu: Insights</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0F172A;text-decoration:none}a:hover{color:#0E7C6B}
</style>
</helmet>
<div style="width:1440px;height:520px;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;color:#0F172A;background:#F5F7FA">
<header style="background:#FFFFFF;border-bottom:1px solid #E2E8F0">
<div style="max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px">
<span style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:8px;background:#0E7C6B;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px">SL</span><span style="font-weight:700;font-size:18px">SentientLogs</span></span>
<nav aria-label="Main" style="display:flex;gap:22px;font-size:15px;font-weight:500"><a href="#">Explore ▾</a><a href="#" style="color:#0E7C6B;font-weight:700;border-bottom:2px solid #0E7C6B;padding-bottom:4px">Insights ▴</a><a href="#">About ▾</a><a href="Pricing.dc.html">Pricing</a></nav>
</div>
</header>
<div style="max-width:1200px;margin:0 auto;padding:0 24px">
<div style="background:#FFFFFF;border:1px solid #E2E8F0;border-top:0;border-radius:0 0 16px 16px;box-shadow:0 12px 32px rgba(15,23,42,.12);padding:28px;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:28px">
<div>
<div style="font-size:13px;font-weight:700;color:#64748B;margin-bottom:12px">What stores offer</div>
<sc-for list="{{a}}" as="i" hint-placeholder-count="4"><a href="#" style="display:block;padding:9px 0"><div style="font-weight:700;font-size:16px">{{i.n}}</div><div style="font-size:14px;color:#64748B">{{i.d}}</div></a></sc-for>
</div>
<div>
<div style="font-size:13px;font-weight:700;color:#64748B;margin-bottom:12px">Across the market</div>
<sc-for list="{{b}}" as="i" hint-placeholder-count="4"><a href="#" style="display:block;padding:9px 0"><div style="font-weight:700;font-size:16px">{{i.n}}</div><div style="font-size:14px;color:#64748B">{{i.d}}</div></a></sc-for>
</div>
<a href="#" style="display:block;background:#F5F7FA;border-radius:12px;padding:20px">
<div style="font-size:13px;font-weight:700;color:#0E7C6B">Featured</div>
<div style="font-weight:700;font-size:17px;margin-top:6px">Buy now, pay later by industry</div>
<div style="margin-top:12px">
<sc-for list="{{bars}}" as="r" hint-placeholder-count="5"><div style="display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px"><span style="width:110px">{{r.n}}</span><span style="flex:1;height:8px;background:#E2E8F0;border-radius:4px"><span style="{{r.bar}}"></span></span><strong style="width:34px;text-align:right">{{r.v}}</strong></div></sc-for>
</div>
</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const bars = [["Fashion", 60], ["Beauty", 60], ["Electronics", 55], ["Homewares", 54], ["Pet", 39]];
    return {
      a: [{ n: "Shipping", d: "Free-shipping minimums and delivery fees" }, { n: "Returns", d: "Returns windows and change of mind" },
        { n: "Payments", d: "Buy now, pay later and wallets" }, { n: "Promotions", d: "Who's on sale, how deep, how long" }],
      b: [{ n: "Tech", d: "Tools and platforms stores use" }, { n: "Policies", d: "Warranty, loyalty and more" },
        { n: "Benchmarks", d: "What's normal, with the full spread" }, { n: "Industries", d: "Compare 9 industries side by side" }],
      bars: bars.map(([n, v]) => ({ n, v: v + "%", bar: `display:block;height:8px;border-radius:4px;background:#2563EB;width:${v}%` })),
    };
  }
}
</script>
</body>
</html>
