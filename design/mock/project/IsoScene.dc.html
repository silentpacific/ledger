<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Isometric scene: the five layers of how a store sells</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
.lay{animation-duration:9s;animation-timing-function:cubic-bezier(.45,0,.2,1);animation-iteration-count:infinite}
.l0{animation-name:x0}.l1{animation-name:x1}.l2{animation-name:x2}.l3{animation-name:x3}.l4{animation-name:x4}.l5{animation-name:x5}
@keyframes x0{0%,12%,92%,100%{transform:translateY(0)}42%,70%{transform:translateY(0)}}
@keyframes x1{0%,12%,92%,100%{transform:translateY(0)}42%,70%{transform:translateY(-34px)}}
@keyframes x2{0%,12%,92%,100%{transform:translateY(0)}42%,70%{transform:translateY(-68px)}}
@keyframes x3{0%,12%,92%,100%{transform:translateY(0)}42%,70%{transform:translateY(-102px)}}
@keyframes x4{0%,12%,92%,100%{transform:translateY(0)}42%,70%{transform:translateY(-136px)}}
@keyframes x5{0%,12%,92%,100%{transform:translateY(0)}42%,70%{transform:translateY(-150px)}}
.beam{animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35}to{opacity:.8}}
.step{opacity:0;animation:pay 4.8s ease-in-out infinite}
@keyframes pay{0%{opacity:0}8%{opacity:1}78%{opacity:1}88%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.lay,.beam{animation:none}.step{animation:none;opacity:1}}
</style>
</helmet>
<div style="width:1440px;height:1360px;box-sizing:border-box;position:relative;font-family:Inter,system-ui,sans-serif;color:#0F172A;background:#FFFFFF;overflow:hidden">
<div style="position:absolute;left:64px;top:40px;width:520px">
<p style="margin:0 0 10px;font-size:15px;font-weight:600;color:#0E7C6B">Your eye in the sky</p>
<h1 style="margin:0;font-size:46px;line-height:1.08;letter-spacing:-1.2px;font-weight:800">Every layer of how a store sells. Watched every week.</h1>
<p style="margin:16px 0 0;font-size:17px;line-height:1.5;color:#475569">From the checkout to the delivery van: the facts behind 964 Australian online stores, quoted from their own pages.</p>
</div>

<svg viewBox="0 0 1440 1360" width="1440" height="1360" role="img" aria-label="Isometric illustration: five stacked layers of an online store (store and checkout, promotions, payment options, policies, shipping and delivery) with an eye above scanning them" style="position:absolute;left:0;top:0">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"></stop><stop offset="1" stop-color="#1D4ED8"></stop></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC"></stop><stop offset="1" stop-color="#E2E8F0"></stop></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E7C6B" stop-opacity="0.30"></stop><stop offset="1" stop-color="#0E7C6B" stop-opacity="0"></stop></linearGradient>
<radialGradient id="iris" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0F172A"></stop><stop offset="0.55" stop-color="#0E7C6B"></stop><stop offset="1" stop-color="#5EAA9D"></stop></radialGradient>
</defs>
<sc-for list="{{layers}}" as="L" hint-placeholder-count="5">
<g class="{{L.cls}}">
<sc-for list="{{L.shapes}}" as="s" hint-placeholder-count="30"><path d="{{s.d}}" fill="{{s.f}}" stroke="{{s.st}}" stroke-width="{{s.sw}}" opacity="{{s.o}}" stroke-dasharray="{{s.dash}}" stroke-linejoin="round" stroke-linecap="round" class="{{s.c}}" style="{{s.style}}"></path></sc-for>
<sc-for list="{{L.texts}}" as="t" hint-placeholder-count="2"><text transform="{{t.m}}" font-family="Inter" font-weight="800" font-size="{{t.size}}" fill="{{t.f}}" text-anchor="middle">{{t.s}}</text></sc-for>
<path d="{{L.leader}}" fill="none" stroke="#94A3B8" stroke-width="1"></path>
<circle cx="{{L.dotx}}" cy="{{L.doty}}" r="4" fill="#FFFFFF" stroke="{{L.color}}" stroke-width="2"></circle>
<rect x="{{L.cx}}" y="{{L.cy}}" width="280" height="84" rx="12" fill="#FFFFFF" stroke="#E2E8F0"></rect>
<text x="{{L.tx}}" y="{{L.ty1}}" font-family="Inter" font-size="12" font-weight="700" fill="{{L.color}}">{{L.name}}</text>
<text x="{{L.tx}}" y="{{L.ty2}}" font-family="Inter" font-size="24" font-weight="800" fill="#0F172A">{{L.stat}}</text>
<text x="{{L.tx}}" y="{{L.ty3}}" font-family="Inter" font-size="13" fill="#64748B">{{L.sub}}</text>
</g>
</sc-for>
<g class="lay l4"><path d="{{beam}}" fill="url(#beam)" class="beam"></path></g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1360}}'>
class Component extends DCLogic {
  renderVals() {
    const s = 0.85, ox = 960, c = 0.866, n = 0.5, f1 = (v) => v.toFixed(1);
    const mkLayer = (i, oy, plate, meta, draw) => {
      const P = (x, y, z) => [ox + (x - y) * c * s, oy + (x + y) * n * s - z * s];
      const path = (pts) => "M" + pts.map((p) => f1(p[0]) + "," + f1(p[1])).join(" L") + " Z";
      const open = (pts) => "M" + pts.map((p) => f1(p[0]) + "," + f1(p[1])).join(" L");
      const shapes = [], texts = [];
      const add = (d, f, st, sw, o, extra) => shapes.push(Object.assign({ d, f, st: st || "none", sw: sw || 0, o: o == null ? 1 : o, dash: "none", c: "", style: "" }, extra || {}));
      const flat = (x, y, z, w, d) => path([P(x, y, z), P(x + w, y, z), P(x + w, y + d, z), P(x, y + d, z)]);
      const R = (xc, y1, z1, y2, z2) => path([P(xc, y1, z2), P(xc, y2, z2), P(xc, y2, z1), P(xc, y1, z1)]);
      const Lf = (yc, x1, z1, x2, z2) => path([P(x1, yc, z2), P(x2, yc, z2), P(x2, yc, z1), P(x1, yc, z1)]);
      const box = (x, y, z, w, d, h, top, left, rgt, st) => {
        add(path([P(x, y + d, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x, y + d, z)]), left, st, 1);
        add(path([P(x + w, y, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x + w, y, z)]), rgt, st, 1);
        add(flat(x, y, z + h, w, d), top, st, 1);
        if (w > 10 && d > 10) add(open([P(x, y + d, z + h), P(x + w, y + d, z + h), P(x + w, y, z + h)]), "none", "#FFFFFF", 0.8, 0.75);
      };
      const ring = (fn, k) => { const pts = []; for (let a = 0; a < (k || 28); a++) pts.push(fn((a / (k || 28)) * Math.PI * 2)); return pts; };
      const disc = (xc, yc, z, r) => ring((t) => P(xc + r * Math.cos(t), yc + r * Math.sin(t), z));
      const discL = (xc, yc, zc, r) => ring((t) => P(xc + r * Math.cos(t), yc, zc + r * Math.sin(t)));
      const cyl = (xc, yc, z, r, h, top, side, st) => {
        const front = []; for (let a = -45; a <= 135; a += 10) front.push((a * Math.PI) / 180);
        const bot = front.map((t) => P(xc + r * Math.cos(t), yc + r * Math.sin(t), z));
        const tp = front.slice().reverse().map((t) => P(xc + r * Math.cos(t), yc + r * Math.sin(t), z + h));
        add(path(bot.concat(tp)), side, st, 1);
        add(path(disc(xc, yc, z + h, r)), top, st, 1);
      };
      const mTop = (x, y, z) => { const p = P(x, y, z); return `matrix(${f1(c * s * 10) / 10},${f1(n * s * 10) / 10},${f1(-c * s * 10) / 10},${f1(n * s * 10) / 10},${f1(p[0])},${f1(p[1])})`; };
      const mRight = (x, y, z) => { const p = P(x, y, z); return `matrix(${(c * s).toFixed(3)},${(-n * s).toFixed(3)},0,${s.toFixed(3)},${f1(p[0])},${f1(p[1])})`; };
      const mLeft = (x, y, z) => { const p = P(x, y, z); return `matrix(${(c * s).toFixed(3)},${(n * s).toFixed(3)},0,${s.toFixed(3)},${f1(p[0])},${f1(p[1])})`; };
      const txt = (m, str, size, fill) => texts.push({ m, s: str, size, f: fill });
      // the plate
      box(0, 0, 0, 320, 320, 14, plate[0], plate[1], plate[2], plate[3]);
      for (let g = 40; g < 320; g += 40) { add(open([P(g, 0, 14), P(g, 320, 14)]), "none", plate[4], 1); add(open([P(0, g, 14), P(320, g, 14)]), "none", plate[4], 1); }
      for (let g = 20; g < 320; g += 40) { add(open([P(g, 0, 14), P(g, 320, 14)]), "none", plate[4], 0.5, 0.55); add(open([P(0, g, 14), P(320, g, 14)]), "none", plate[4], 0.5, 0.55); }
      add(flat(8, 8, 14.05, 304, 304), "none", plate[3], 0.6, 0.45);
      for (let g = 40; g < 320; g += 40) { add(open([P(g, 320, 14), P(g, 320, 10)]), "none", plate[3], 0.6, 0.8); add(open([P(320, g, 14), P(320, g, 10)]), "none", plate[3], 0.6, 0.8); }
      draw({ P, path, open, add, flat, R, Lf, box, ring, disc, discL, cyl, txt, mTop, mRight, mLeft });
      const anchor = P(0, 320, 7), cardX = 150, cardY = anchor[1] - 42;
      return Object.assign({ cls: "lay l" + i, shapes, texts,
        cx: cardX, cy: cardY, tx: cardX + 18, ty1: cardY + 24, ty2: cardY + 52, ty3: cardY + 72,
        leader: `M${cardX + 280},${f1(cardY + 42)} L${f1(anchor[0])},${f1(anchor[1])}`, dotx: f1(anchor[0]), doty: f1(anchor[1]) }, meta);
    };
    const gap = 150, base = 1000, layers = [];

    // 1. Store, cart and checkout
    layers.push(mkLayer(0, base, ["#FFFFFF", "#E2E8F0", "#CBD5E1", "#CBD5E1", "#EEF2F6"],
      { name: "1 · Store, cart and checkout", stat: "964 stores", sub: "read every week", color: "#334155" }, (g) => {
      g.add(g.open([g.P(180, 284, 14.2), g.P(282, 284, 14.2)]), "none", "#94A3B8", 0.8, 1, { dash: "3 4" });
      [180, 231, 282].forEach((x, k) => g.add(g.path(g.disc(x, 284, 14.3, 4)), k === 2 ? "#0E7C6B" : "#FFFFFF", "#94A3B8", 0.8));
      g.add(g.flat(36, 36, 14.1, 120, 70), "#0F172A", null, 0, 0.06);
      g.box(30, 30, 14, 120, 70, 70, "#F8FAFC", "#E2E8F0", "#CBD5E1", "#CBD5E1");
      g.add(g.Lf(100.2, 42, 36, 84, 66), "#BFDBFE", "#93C5FD", 1);
      g.add(g.Lf(100.2, 96, 14, 122, 56), "#334155");
      for (let k = 0; k < 11; k++) g.add(g.Lf(100.4, 32 + k * 10.5, 70, 42.5 + k * 10.5, 82), k % 2 ? "#FFFFFF" : "#0E7C6B", "#0E7C6B", 0.6);
      g.add(g.R(150.2, 42, 52, 92, 70), "#0E7C6B");
      g.txt(g.mRight(150.4, 82, 57), "SHOP", 15, "#FFFFFF");
      g.box(185, 40, 14, 34, 34, 30, "#0E7C6B", "#0B6457", "#095247");
      g.box(232, 44, 14, 28, 28, 46, "#3B82F6", "#2563EB", "#1D4ED8");
      g.box(274, 50, 14, 30, 30, 22, "#FBBF24", "#F59E0B", "#D97706");
      g.add(g.flat(64, 176, 14.1, 60, 44), "#0F172A", null, 0, 0.06);
      g.box(60, 170, 28, 60, 44, 26, "#F1F5F9", "#FFFFFF", "#E2E8F0", "#94A3B8");
      for (let k = 1; k < 6; k++) g.add(g.open([g.P(60 + k * 10, 214, 28), g.P(60 + k * 10, 214, 54)]), "none", "#CBD5E1", 1);
      g.box(70, 176, 54, 18, 18, 10, "#0E7C6B", "#0B6457", "#095247");
      g.box(92, 184, 54, 16, 16, 14, "#F59E0B", "#D97706", "#B45309");
      g.add(g.open([g.P(120, 172, 54), g.P(134, 168, 70), g.P(146, 168, 70)]), "none", "#334155", 2.4);
      g.add(g.open([g.P(64, 214, 28), g.P(64, 214, 20)]), "none", "#334155", 2);
      g.add(g.open([g.P(116, 214, 28), g.P(116, 214, 20)]), "none", "#334155", 2);
      g.add(g.path(g.discL(68, 214.2, 19, 5)), "#1E293B");
      g.add(g.path(g.discL(112, 214.2, 19, 5)), "#1E293B");
      g.box(170, 210, 14, 116, 42, 6, "#0E7C6B", "#0B6457", "#095247");
      g.txt(g.mTop(228, 236, 20.3), "Checkout", 15, "#FFFFFF");
      g.add(g.open([g.P(63, 100.4, 36), g.P(63, 100.4, 66)]), "none", "#FFFFFF", 1);
      g.add(g.open([g.P(42, 100.4, 51), g.P(84, 100.4, 51)]), "none", "#FFFFFF", 1);
      g.add(g.open([g.P(42, 100.5, 36), g.P(84, 100.5, 36)]), "none", "#64748B", 1.4);
      g.add(g.open([g.P(117, 100.5, 31), g.P(117, 100.5, 38)]), "none", "#CBD5E1", 1.6);
      g.add(g.open([g.P(30, 100.3, 22), g.P(150, 100.3, 22), g.P(150, 30, 22)]), "none", "#CBD5E1", 0.6);
      g.add(g.open([g.P(190, 74.3, 32), g.P(212, 74.3, 32)]), "none", "#FFFFFF", 0.8, 0.8);
      g.add(g.open([g.P(190, 74.3, 28), g.P(204, 74.3, 28)]), "none", "#FFFFFF", 0.8, 0.6);
      g.add(g.open([g.P(236, 72.3, 50), g.P(256, 72.3, 50)]), "none", "#FFFFFF", 0.8, 0.8);
      g.add(g.open([g.P(278, 80.3, 30), g.P(300, 80.3, 30)]), "none", "#FFFFFF", 0.8, 0.8);
      g.add(g.flat(200, 40, 44.15, 4, 34), "#0B6457");
      g.add(g.open([g.P(160, 214, 28), g.P(160, 214, 50)]), "none", "#94A3B8", 0.6);
    }));

    // 2. Promotions
    layers.push(mkLayer(1, base - gap, ["#FFFBEB", "#FDE68A", "#FCD34D", "#F59E0B", "#FEF3C7"],
      { name: "2 · Promotions", stat: "67% on sale", sub: "running an offer right now", color: "#B45309" }, (g) => {
      g.add(g.flat(196, 256, 14.15, 96, 40), "#FFFFFF", "#F59E0B", 1, 1, { dash: "4 3" });
      g.txt(g.mTop(244, 280, 14.3), "CODE: SAVE15", 10, "#B45309");
      [[150, 118, "#F59E0B"], [272, 132, "#3B82F6"], [292, 214, "#0E7C6B"], [28, 140, "#F59E0B"], [130, 262, "#3B82F6"], [146, 160, "#0E7C6B"]].forEach(([x, y, col]) => g.add(g.flat(x, y, 14.2, 6, 6), col, null, 0, 0.8));
      g.add(g.flat(46, 46, 14.1, 90, 54), "#0F172A", null, 0, 0.07);
      g.box(40, 40, 14, 90, 54, 6, "#F59E0B", "#D97706", "#B45309");
      g.add(g.path(g.disc(54, 67, 20.2, 5)), "#FFFBEB");
      g.txt(g.mTop(92, 60, 20.3), "SALE", 18, "#FFFFFF");
      g.txt(g.mTop(92, 80, 20.3), "up to 40% off", 11, "#FFFBEB");
      g.cyl(215, 72, 14, 30, 14, "#FBBF24", "#D97706", "#D97706");
      g.txt(g.mTop(215, 79, 28.3), "%", 26, "#FFFFFF");
      g.box(170, 160, 14, 96, 84, 10, "#FFFFFF", "#F1F5F9", "#E2E8F0", "#CBD5E1");
      g.add(g.flat(170, 160, 24.1, 96, 18), "#D97706");
      for (let r = 0; r < 3; r++) for (let k = 0; k < 4; k++) g.add(g.flat(178 + k * 22, 184 + r * 19, 24.2, 16, 13), r === 1 && k === 2 ? "#F59E0B" : "#F1F5F9", "#E2E8F0", 0.6);
      g.add(g.flat(64, 196, 14.1, 50, 50), "#0F172A", null, 0, 0.07);
      g.box(58, 190, 14, 50, 50, 40, "#3B82F6", "#2563EB", "#1D4ED8");
      g.add(g.flat(79, 190, 54.1, 8, 50), "#FBBF24");
      g.add(g.flat(58, 211, 54.1, 50, 8), "#FBBF24");
      g.add(g.Lf(240.2, 79, 14, 87, 54), "#FBBF24");
      g.add(g.R(108.2, 211, 14, 219, 54), "#F59E0B");
      g.add(g.path(g.disc(76, 207, 55, 7)), "#F59E0B", "#D97706", 1);
      g.add(g.path(g.disc(90, 222, 55, 7)), "#F59E0B", "#D97706", 1);
      g.add(g.open([g.P(54, 67, 20.3), g.P(40, 58, 18), g.P(30, 60, 14.3)]), "none", "#92400E", 0.8);
      [196, 240].forEach((x) => g.add(g.open([g.P(x, 166, 24.3), g.P(x, 166, 31)]), "none", "#334155", 1.6));
      g.add(g.open([g.P(48, 94.2, 20), g.P(126, 94.2, 20)]), "none", "#FFFFFF", 0.6, 0.6);
      g.add(g.path(g.disc(215, 72, 14.2, 34)), "none", "#D97706", 0.6, 0.5);
    }));

    // 3. Payment options
    layers.push(mkLayer(2, base - 2 * gap, ["#FFFFFF", "#D5EFEA", "#B5E0D7", "#A7D8CE", "#E3F3EF"],
      { name: "3 · Payment options", stat: "53% offer BNPL", sub: "Afterpay leads, at 463 stores", color: "#0E7C6B" }, (g) => {
      g.add(g.open([g.P(30, 266, 14.2), g.P(202, 266, 14.2)]), "none", "#0E7C6B", 0.8, 1, { dash: "3 4" });
      g.add(g.flat(36, 46, 14.1, 70, 90), "#0F172A", null, 0, 0.06);
      g.box(30, 40, 14, 70, 90, 22, "#475569", "#334155", "#1E293B");
      g.add(g.flat(40, 50, 36.2, 50, 28), "#5EEAD4");
      for (let r = 0; r < 3; r++) for (let k = 0; k < 3; k++) g.add(g.flat(42 + k * 16, 88 + r * 12, 36.2, 11, 8), r === 2 && k === 2 ? "#0E7C6B" : "#94A3B8");
      g.add(g.path([g.P(56, 40, 36), g.P(78, 40, 36), g.P(78, 40, 62), g.P(56, 40, 62)]), "#FFFFFF", "#CBD5E1", 1);
      g.add(g.flat(136, 48, 14.1, 100, 63), "#0F172A", null, 0, 0.07);
      g.box(130, 40, 14, 100, 63, 3, "url(#card)", "#1E40AF", "#1E3A8A");
      g.add(g.flat(144, 50, 17.2, 16, 12), "#FBBF24", "#D97706", 0.6);
      for (let k = 0; k < 4; k++) g.add(g.flat(144 + k * 20, 84, 17.2, 15, 3), "#FFFFFF", null, 0, 0.75);
      [30, 76, 122, 168].forEach((x, k) => {
        g.box(x, 222, 14, 34, 34, 8, "#FFFFFF", "#E2E8F0", "#CBD5E1", "#CBD5E1");
        g.add(g.flat(x, 222, 22.1, 34, 34), "#0E7C6B", null, 0, 1, { c: "step", style: "animation-delay:" + (k * 0.7).toFixed(1) + "s" });
        g.txt(g.mTop(x + 17, 243, 22.3), String(k + 1), 15, "#0F172A");
      });
      g.add(g.flat(256, 176, 14.1, 18, 80), "#0F172A", null, 0, 0.08);
      g.box(250, 170, 14, 12, 72, 128, "#1E293B", "#0F172A", "#1E293B");
      g.add(g.R(262.2, 176, 24, 236, 136), "url(#screen)");
      g.add(g.R(262.4, 184, 96, 228, 122), "url(#card)");
      g.add(g.path(g.ring((t) => g.P(262.5, 206 + 11 * Math.cos(t), 64 + 11 * Math.sin(t)), 24)), "#0E7C6B");
      g.add(g.open([g.P(262.6, 200, 64), g.P(262.6, 204, 59), g.P(262.6, 213, 69)]), "none", "#FFFFFF", 2.4);
      g.add(g.R(262.4, 190, 38, 222, 44), "#0E7C6B", null, 0, 0.85);
      [56, 51, 46].forEach((z, k) => g.add(g.open([g.P(60, 40.2, z), g.P(k === 2 ? 70 : 74, 40.2, z)]), "none", "#CBD5E1", 0.8));
      g.add(g.open([g.P(144, 56, 17.3), g.P(160, 56, 17.3)]), "none", "#B45309", 0.5);
      g.add(g.open([g.P(152, 50, 17.3), g.P(152, 62, 17.3)]), "none", "#B45309", 0.5);
      [5, 9, 13].forEach((r) => { const pts = []; for (let a = -40; a <= 40; a += 10) { const t = (a * Math.PI) / 180; pts.push(g.P(212 + r * Math.cos(t), 56 + r * Math.sin(t), 17.3)); } g.add(g.open(pts), "none", "#FFFFFF", 0.9, 0.85); });
      g.add(g.open([g.P(144, 96, 17.3), g.P(176, 96, 17.3)]), "none", "#FFFFFF", 0.6, 0.6);
      g.add(g.R(262.3, 200, 129, 212, 131), "#475569");
      g.add(g.open([g.P(30, 130.3, 30), g.P(100, 130.3, 30)]), "none", "#475569", 0.6);
    }));

    // 4. Policies
    layers.push(mkLayer(3, base - 3 * gap, ["#F8FAFF", "#DBEAFE", "#BFDBFE", "#93C5FD", "#E0ECFF"],
      { name: "4 · Policies", stat: "30-day returns", sub: "the most common window", color: "#1D4ED8" }, (g) => {

    const top = layers[4];
    const ex = ox, ey = base - 4 * gap - 150;
    const P4 = (x, y, z) => [ox + (x - y) * c * s, base - 4 * gap + (x + y) * n * s - z * s];
    const a = P4(0, 0, 14), b = P4(320, 0, 14), d = P4(0, 320, 14), e = P4(320, 320, 14);
    return {
