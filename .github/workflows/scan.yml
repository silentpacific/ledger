name: Scan

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "One domain, or several separated by commas (e.g. zamels.com.au,najo.com.au). Leave empty to scan all enabled sites."
        required: false
        default: ""
      mode:
        description: "full (everything) or weekly (promotions, products, content)"
        required: true
        default: "full"
        type: choice
        options: [full, weekly]
      model:
        description: "Optional model override for a test (e.g. claude-haiku-5-5). Empty = normal model."
        required: false
        default: ""
      budget:
        description: "Optional: pause once estimated AI spend in this run reaches this many USD (e.g. 3)"
        required: false
        default: ""
      recheck_refusals:
        description: "Only recheck the terms of switched-off sites (no scanning)"
        required: false
        default: false
        type: boolean
      dedupe_promotions:
        description: "Only merge duplicate promotions already stored (no scanning)"
        required: false
        default: false
        type: boolean
      no_ai:
        description: "Test only: code-based facts, no AI calls (costs nothing)"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Test only: scan and save the file, but don't store anything in the database"
        required: false
        default: false
        type: boolean
  schedule:
    # Times are UTC. Weekly scan: Monday 02:13 UTC (about 12:43 Adelaide).
    - cron: "13 2 * * 1"
    # Monthly full scan: 1st of the month 03:17 UTC.
    - cron: "17 3 1 * *"

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      CRAWLER_CONTACT: ${{ vars.CRAWLER_CONTACT }}
      CLAUDE_MODEL: ${{ github.event.inputs.model || vars.CLAUDE_MODEL }}
      ESCALATION_MODEL: ${{ vars.ESCALATION_MODEL }}
      TERMS_UNCLEAR_POLICY: ${{ vars.TERMS_UNCLEAR_POLICY || 'skip' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        if: github.event.inputs.recheck_refusals != 'true' && github.event.inputs.dedupe_promotions != 'true'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "17 3 1 * *" ]; then MODE=full; else MODE=weekly; fi
          fi
          # Scheduled runs pause at the RUN_BUDGET_USD variable (default $4) so a run can't drain the balance.
          B="${{ github.event.inputs.budget }}"
          [ -z "$B" ] && B="${{ vars.RUN_BUDGET_USD || '4' }}"
          BUDGET="--budget $B"
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          if [ "${{ github.event.inputs.no_ai }}" = "true" ]; then DRY="$DRY --no-ai"; fi
          if [ -n "${{ github.event.inputs.domain }}" ]; then
            IFS=',' read -ra DOMAINS <<< "${{ github.event.inputs.domain }}"
            for D in "${DOMAINS[@]}"; do
              D="$(echo "$D" | xargs)"
              [ -n "$D" ] && python run.py --domain "$D" --mode "$MODE" $DRY
            done
          else
            python run.py --all --mode "$MODE" $BUDGET
          fi
      - name: Recheck terms of switched-off sites (monthly run only)
        if: github.event.schedule == '17 3 1 * *' || github.event.inputs.recheck_refusals == 'true'
        run: python run.py --recheck-refusals ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Merge duplicate promotions
        if: github.event.inputs.dedupe_promotions == 'true'
        run: python run.py --dedupe-promotions ${{ github.event.inputs.domain != '' && format('--domain {0}', github.event.inputs.domain) || '' }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Keep scan files for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-output
          path: scan-output/
          retention-days: 14
