# Works out every page's numbers after each scan (web/scripts/build-views.ts) and stores them in the database,
# so website pages read only what they show. Also runs every 6 hours (offers end, "this week" moves on)
# and when the page logic changes.
name: page data
on:
  workflow_run:
    workflows: [Scan]
    types: [completed]
  schedule:
    - cron: "41 */6 * * *"
  push:
    branches: [main]
    paths: ["web/lib/**", "web/scripts/**", ".github/workflows/views.yml"]
  workflow_dispatch: {}
concurrency:
  group: page-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx -y tsx scripts/build-views.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # reads use the service key too, so a large store list never hits the public key's time limit
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
