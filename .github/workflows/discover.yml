name: discover stores

# Finds new Australian online stores (discover_stores.py), adds them, then starts parallel full scans of them.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "How many new stores to add"
        default: "750"
      chunks:
        description: "How many scan runs to start side by side"
        default: "8"
      per_industry:
        description: "At most this many new stores per industry"
        default: "110"
      budget:
        description: "AI spend cap per scan run, USD"
        default: "4"
      source:
        description: "Where to find stores: commoncrawl or tranco"
        default: "commoncrawl"
      max_check:
        description: "Most candidate sites to check"
        default: "6000"
      dry_run:
        description: "Only report what would be added (true/false)"
        default: "false"
      review_since:
        description: "Instead of discovering: re-judge stores added since this UTC time (e.g. 2026-11-27T10:35)"
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CRAWLER_CONTACT: ${{ vars.CRAWLER_CONTACT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt duckdb
      - name: Review stores already added
        if: inputs.review_since != ''
        run: python discover_stores.py --review-since "${{ inputs.review_since }}" --review-limit "${{ inputs.max_check }}" ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Find stores
        if: inputs.review_since == ''
        run: python discover_stores.py --target "${{ inputs.target }}" --chunks "${{ inputs.chunks }}" --per-industry "${{ inputs.per_industry }}" --source "${{ inputs.source }}" --max-check "${{ inputs.max_check }}" ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Start a full scan for each chunk
        if: inputs.review_since == '' && inputs.dry_run != 'true'
        run: |
          for f in chunk_*.txt; do
            gh workflow run scan.yml --ref main -f domain="$(cat "$f")" -f mode=full -f budget="${{ inputs.budget }}" -f batch=true
            echo "started scan for $(tr ',' '\n' < "$f" | wc -l) stores ($f)"
            sleep 5
          done
